[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jzapi"
version = "0.1.0"
description = "Budget-guarded, usage-logged Claude API helper for Jehanzeb's repos"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0,<3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["jzapi"]

[tool.pytest.ini_options]
testpaths = ["jzapi/tests"]
addopts = "-p no:cacheprovider"
